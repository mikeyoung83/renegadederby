media:
  # Homepage media
  - name: homepage_media
    label: Homepage Images
    input: src/assets/homepage
    output: ../../assets/homepage
    categories: [image]

  # Sponsors media
  - name: sponsors_media
    label: Sponsor Logos
    input: src/assets/sponsors
    output: ../../assets/sponsors
    categories: [image]

  # Officials media
  - name: officials_media
    label: Officials Media
    input: src/assets/officials
    output: ../../assets/officials
    categories: [image]

  # Players media
  - name: players_media
    label: Players Media
    input: src/assets/teams
    output: /src/assets/teams
    categories: [image]

  # Coaches media
  - name: coaches_media
    label: Coaches Media
    input: src/assets/teams
    output: ../../assets/teams
    categories: [image]

content:
  # --- HOMEPAGE ---
  - name: homepage
    label: Homepage Sections
    type: collection
    path: src/content/homepage
    filename:
      template: "{title}.md"
      field: true # 'true' allows editing the filename even after creation
    view:
      layout: list
      primary: "{title}"
      default:
        sort: filename
        order: asc
    fields:
      - name: title
        label: Section Title
        type: string
      - name: sectionImage
        label: Section Image
        type: image
        media: homepage_media
        options:
          media: homepage_media
          path: src/assets/homepage
      - name: body
        label: Content Body
        type: rich-text

  # --- SPONSORS ---
  - name: sponsors
    label: Sponsors
    type: collection
    path: src/content/sponsors
    # Using the name for the filename to keep things organized
    filename: "{fields.name}.md"
    fields:
      - name: name
        label: Sponsor Name
        type: string
      - name: url
        label: Website URL
        type: string
        # Help text to remind users to include https://
        help: "Must be a full URL (e.g., https://renegadederbydames.com)"
      - name: logo
        label: Sponsor Logo
        type: image
        options:
          media: sponsors_media
          path: src/assets/sponsors
      - name: body
        label: Notes / Description
        type: rich-text

  # --- GAMES ---
  - name: games
    label: Games & Schedule
    type: collection
    path: src/content/games
    filename: "{fields.date}.md"
    fields:
      - name: date
        label: Game Date
        type: date

      - name: location
        label: Location
        type: select
        options:
          values:
            - name: home
              label: Home
            - name: away
              label: Away

      - name: isTentative
        label: Event-wide Tentative Status
        type: boolean
        default: false

      - name: hostedBy
        label: Hosted By
        type: string

      - name: pricing
        label: Ticket Pricing
        type: string

      - name: entries
        label: Individual Game Matches
        type: object
        list: true
        # This fixes the display label in the CMS sidebar/list
        view:
          primary: "{title}"
          summary: "{time}"
        fields:
          - name: time
            label: Start Time
            type: string
          - name: title
            label: Matchup Title
            type: string

      - name: body
        label: Additional Notes
        type: rich-text

  # --- OFFICIALS ---
  - name: officials
    label: Officials
    type: collection
    path: src/content/officials
    view:
      primary: "{name}"
    fields:
      - name: name
        label: Official Name
        type: string

      - name: photo
        label: Official Photo
        type: image
        options:
          media: officials_media
          path: src/assets/officials

  # --- COACHES ---
  - name: coaches
    label: Coaches
    type: collection
    path: src/content/coaches
    subfolders: true
    view:
      layout: tree
      primary: "{name}"
    fields:
      - name: name
        label: Coach Name
        type: string
      - name: photo
        label: Coach Photo
        type: image
        options:
          media: coaches_media
          path: src/assets/coaches

  # --- PLAYERS ---
  - name: players
    filename:
      template: "{number}.md"
      field: false
    label: Players
    type: collection
    path: src/content/players
    subfolders: true
    view:
      layout: tree
      primary: "{name}"
      summary: "#{number}"
    fields:
      - name: name
        label: Skater Name
        type: string
      - name: number
        label: Jersey Number
        type: number
      - name: photo
        label: Player Photo
        type: image
        options:
          media: players_media
          path: src/assets/teams

  # --- HOMEPAGE SETTINGS (singleton) ---
  - name: homepage_settings
    label: Homepage Settings
    type: file
    path: src/content/homepage-settings.md
    fields:
      # Hero Section
      - name: hero_heading
        label: Hero Heading
        type: string

      - name: hero_tagline
        label: Hero Tagline
        type: text

      - name: hero_cta_primary_label
        label: "Primary CTA: Label"
        type: string

      - name: hero_cta_primary_url
        label: "Primary CTA: URL"
        type: string

      - name: hero_cta_secondary_label
        label: "Secondary CTA: Label"
        type: string

      - name: hero_cta_secondary_url
        label: "Secondary CTA: URL"
        type: string

      # About Section
      - name: about_eyebrow
        label: About Eyebrow Text
        type: string

      - name: about_heading
        label: About Heading
        type: string

      - name: about_cta_label
        label: "About CTA: Label"
        type: string

      - name: about_cta_url
        label: "About CTA: URL"
        type: string

      - name: body
        label: About Body Copy
        type: rich-text
